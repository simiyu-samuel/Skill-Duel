<style>
        body {
            background-color: #1A1A2E;
            color: #f7dcdd;
            font-family: 'Inter', sans-serif;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }

            box-shadow: 0 0 15px rgba(255, 215, 0, 0.4);
            border: 2px solid #FFD700;
        }
        .red-dim {
            border: 2px solid #b71d3f;
            opacity: 0.7;
        }
        .accent-glow {
            box-shadow: 0 0 20px rgba(233, 69, 96, 0.3);
        }

      min-height: max(884px, 100dvh);

<body class="min-h-screen flex flex-col items-center">
<!-- Top App Bar -->
<header class="bg-[#16213E] dark:bg-slate-900 border-b border-[#4A4E8C]/30 fixed top-0 left-0 w-full z-50">
<div class="flex justify-between items-center w-full px-6 py-4 max-w-7xl mx-auto">
<div class="flex items-center gap-stack-sm">
<img alt="User Profile Avatar" class="w-8 h-8 rounded-full border border-outline" data-alt="Close up portrait of a young man with a focused expression, neon rim lighting from a gaming monitor" src="https://lh3.googleusercontent.com/aida-public/AB6AXuD0nHR_svG4I9sJNr4gDWEnWCN5JA4snoQbwKLXcex-CxwlyzmXPbdO_TElcit2_9IQVlNqA9RzEzjbBptTovmi8Y1VXwD97cS0J_PzqNEpadvBCghBCVkdgI6ZbHciPE8eXgNf-oUvZZTNxmzV7mhXZy921Z5CWuG0PJqnIiJAIDc400L5a98e5T79mHynHbTtVzzyKnqeykxSt9H2n6hLZf8gNg8-kbnmiAXJOS-Ilq9e60iJTTThlp_1bEBhCWafWEpNcNo9eVO0"/>
<span class="font-inter font-black uppercase tracking-widest text-[#E94560] dark:text-[#E94560] text-xl italic text-white">DUEL RESULTS</span>
</div>
<span class="material-symbols-outlined text-[#4A4E8C] hover:text-white transition-colors duration-200 cursor-pointer" data-icon="settings">settings</span>
</div>
</header>
<main class="mt-24 mb-32 flex flex-col items-center w-full max-w-[500px] px-container-padding gap-stack-lg">
<!-- Defeat Status -->
<div class="text-center">
<div class="text-6xl mb-stack-sm animate-pulse">💀</div>
<h1 class="font-h1 text-h1 text-white opacity-40 uppercase tracking-tighter">DEFEATED</h1>
</div>
<!-- Score Comparison Card -->
<div class="w-full bg-[#16213E] rounded-[16px] p-stack-lg border border-[#4A4E8C]/30 accent-glow flex items-center justify-between relative">
<!-- Loser -->
<div class="flex flex-col items-center gap-stack-sm flex-1">
<div class="relative">
<img alt="@kofi_duel" class="w-20 h-20 rounded-full red-dim object-cover" data-alt="Young male gamer with headset, low-key lighting with red highlights" src="https://lh3.googleusercontent.com/aida-public/AB6AXuA-jnE8pnZkaEmBqb5OK-Ne4hC-CJwW_yXq4cgQIQEuLfeUqHGA-MbeoNINXOplOj1KQHY1Wb-pdJv_-mcha1nB4aITmr7BlHG8obFmKe8SzndUFleTBZqHiojeuHfL3DIT9n3m9sQl7jHmOqxAtdbmSeqeEALrLLuHBDR3QCP0_BOf6XLx6Hrs65w-ERdud7igOrKpAjGyEMryqIWOG5UZ9uCN5o0IOA6uv7j--ENCfg-U4pj-hNCrm_sUkKv9AOlA71QKSyUrNbmR"/>
<span class="absolute -bottom-1 -right-1 bg-error text-on-error text-[10px] font-bold px-2 py-0.5 rounded-full">L</span>
</div>
<span class="font-label-caps text-outline">@kofi_duel</span>
<span class="font-stats text-[32px] text-outline/50">5/10</span>
</div>
<!-- VS Divider -->
<div class="font-black italic text-outline/30 text-h3 absolute left-1/2 -translate-x-1/2">VS</div>
<!-- Winner -->
<div class="flex flex-col items-center gap-stack-sm flex-1">
<div class="relative">
<img alt="@rival_88" class="w-20 h-20 rounded-full gold-glow object-cover" data-alt="Competitive player looking intense, high contrast lighting with golden aura effect" src="https://lh3.googleusercontent.com/aida-public/AB6AXuDZBwK5FtWVi4HPwtHJDBoqAzwOzxBF77C3nn863QTvo2COJcZEpn62r4qkXrsfUaC4_CC2JmOi57zpmdXkL_82DGAiP1m-j7Bjl3Rzq1RvtdPXuNLreak7-EgRn218Xn9M4oiT3mAIL9EGp7XpaakXSSkA3CgdLzukntukQYeHBeGgjKYwTmwCa7AENtGFIOraopcKOd_6piPkkGUYBaotLxHz6RkRLJSC-MjjRPtdDMHIIh8CcZponbvksynPdTyTtGpo1YOWW_cF"/>
<span class="absolute -bottom-1 -right-1 bg-tertiary text-on-tertiary text-[10px] font-bold px-2 py-0.5 rounded-full shadow-[0_0_10px_rgba(103,220,159,0.5)]">W</span>
</div>
<span class="font-label-caps text-on-surface">@rival_88</span>
<span class="font-stats text-[32px] text-white">9/10</span>
</div>
</div>
<!-- ELO Changes -->
<div class="w-full flex flex-col gap-stack-sm items-center">
<span class="font-label-caps text-outline uppercase">ELO CHANGE</span>
<div class="flex justify-between w-full px-8">
<span class="font-stats text-error">-18 ELO</span>
<span class="font-stats text-tertiary">+18 ELO</span>
</div>
<!-- Progress Bar -->
<div class="w-full mt-stack-md flex flex-col gap-stack-sm">
<div class="flex justify-between items-center px-2">
<div class="flex items-center gap-1">
<span class="font-body-md text-white font-bold">New ELO: 1,222</span>
<span class="material-symbols-outlined text-error text-sm" style="font-variation-settings: 'FILL' 1;">trending_down</span>
</div>
<span class="font-label-caps text-outline">LEVEL 24</span>
</div>
<div class="w-full h-1.5 bg-surface-container-highest rounded-full overflow-hidden">
<div class="h-full bg-primary-container w-[65%] rounded-full shadow-[0_0_8px_#fc536d]"></div>
</div>
</div>
</div>
<!-- Motivational Quote -->
<p class="text-center font-body-md italic text-outline/60 text-sm max-w-[280px]">
            "Your rival answered 4 questions faster than you. Train harder."
        </p>
<!-- Action Section -->
<div class="w-full flex flex-col gap-stack-md mt-stack-lg">
<button class="w-full bg-[#E94560] text-white font-h3 py-4 rounded-xl flex items-center justify-center gap-2 active:scale-95 transition-all shadow-[0_0_20px_rgba(233,69,96,0.4)]">
                REMATCH ⚔️
            </button>

                Review Answers
            </button>
<a class="text-center font-label-caps text-[#4A4E8C] hover:text-[#E94560] transition-colors py-4" href="#">
                GO HOME
            </a>

<span class="material-symbols-outlined" data-icon="home">home</span>
<span class="font-inter text-[10px] font-bold tracking-tighter uppercase">HOME</span>
</a>
<a class="flex flex-col items-center justify-center text-white bg-[#E94560] rounded-lg px-4 py-1.5 shadow-[0_0_15px_#E94560] transition-all scale-105" href="#">
<span class="material-symbols-outlined" data-icon="sports_esports" style="font-variation-settings: 'FILL' 1;">sports_esports</span>
<span class="font-inter text-[10px] font-bold tracking-tighter uppercase">DUELS</span>
</a>
<a class="flex flex-col items-center justify-center text-[#4A4E8C] px-4 py-1.5 hover:text-[#E94560] transition-all duration-200" href="#">
<span class="material-symbols-outlined" data-icon="leaderboard">leaderboard</span>
<span class="font-inter text-[10px] font-bold tracking-tighter uppercase">RANKS</span>
</a>
<a class="flex flex-col items-center justify-center text-[#4A4E8C] px-4 py-1.5 hover:text-[#E94560] transition-all duration-200" href="#">
