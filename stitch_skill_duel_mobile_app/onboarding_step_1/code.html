<div class="w-64 h-64 rounded-full bg-[#E94560]/20 absolute blur-3xl"></div>
</div>

<div class="w-48 h-48 rounded-full border-2 border-[#E94560]/30 flex items-center justify-center bg-slate-900/40 backdrop-blur-sm shadow-[0_0_40px_rgba(233,69,96,0.3)]">

</div>
<!-- Floating decorative gaming elements -->
<div class="absolute -top-10 -right-10 glass-panel p-3 rounded-xl rotate-12">
<span class="material-symbols-outlined text-[#E94560]" data-icon="chess">chess</span>
</div>
<div class="absolute -bottom-8 -left-8 glass-panel p-3 rounded-xl -rotate-12">
<span class="material-symbols-outlined text-[#E94560]" data-icon="videogame_asset">videogame_asset</span>
</div>
</div>
</section>
<!-- Middle: Content Section -->
<section class="flex-grow px-8 flex flex-col items-center justify-start text-center space-y-4 pt-4">

            </p>
</section>

<section class="pb-12 px-container-padding flex flex-col items-center">
<!-- Pagination Dots -->
<div class="flex gap-stack-sm mb-stack-lg">
<div class="w-2.5 h-2.5 rounded-full bg-[#E94560] shadow-[0_0_8px_rgba(233,69,96,0.6)]"></div>
<div class="w-2.5 h-2.5 rounded-full border border-white"></div>
<div class="w-2.5 h-2.5 rounded-full border border-white"></div>
