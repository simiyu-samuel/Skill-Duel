<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;800;900&amp;family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                    "surface-container-high": "#362627",
                    "on-secondary-fixed-variant": "#3d417e",
                    "tertiary-container": "#25a46d",
                    "on-primary": "#67001c",
                    "surface-container-low": "#261819",
                    "tertiary-fixed": "#84f9ba",
                    "surface-tint": "#ffb2b7",
                    "tertiary": "#67dc9f",
                    "primary": "#ffb2b7",
                    "on-tertiary-fixed-variant": "#005232",
                    "surface-container": "#2b1c1d",
                    "primary-fixed-dim": "#ffb2b7",
                    "on-tertiary-fixed": "#002111",
                    "surface-container-lowest": "#170b0c",
                    "primary-fixed": "#ffdadb",
                    "surface-variant": "#413031",
                    "error": "#ffb4ab",
                    "secondary": "#bfc2ff",
                    "on-secondary-container": "#afb3f8",
                    "on-background": "#f7dcdd",
                    "secondary-fixed": "#e0e0ff",
                    "on-secondary": "#262a66",
                    "on-primary-container": "#5b0017",
                    "outline": "#a9898a",
                    "on-error": "#690005",
                    "surface-dim": "#1d1011",
                    "secondary-fixed-dim": "#bfc2ff",
                    "inverse-surface": "#f7dcdd",
                    "on-primary-fixed-variant": "#91002b",
                    "on-surface": "#f7dcdd",
                    "inverse-on-surface": "#3d2c2d",
                    "outline-variant": "#5a4042",
                    "on-secondary-fixed": "#0f1250",
                    "error-container": "#93000a",
                    "surface": "#1d1011",
                    "secondary-container": "#3f4380",
                    "on-surface-variant": "#e2bebf",
                    "background": "#1d1011",
                    "on-error-container": "#ffdad6",
                    "surface-container-highest": "#413031",
                    "surface-bright": "#463536",
                    "on-tertiary": "#003921",
                    "inverse-primary": "#b71d3f",
                    "primary-container": "#fc536d",
                    "on-tertiary-container": "#00311c",
                    "on-primary-fixed": "#40000e",
                    "tertiary-fixed-dim": "#67dc9f"
            },
            "borderRadius": {
                    "DEFAULT": "0.25rem",
                    "lg": "0.5rem",
                    "xl": "0.75rem",
                    "full": "9999px"
            },
            "spacing": {
                    "stack-md": "16px",
                    "stack-lg": "32px",
                    "unit": "8px",
                    "gutter": "16px",
                    "stack-sm": "8px",
                    "container-padding": "24px"
            },
            "fontFamily": {
                    "body-md": ["Inter"],
                    "h3": ["Inter"],
                    "h1": ["Inter"],
                    "stats": ["Inter"],
                    "label-caps": ["Inter"],
                    "body-lg": ["Inter"],
                    "h2": ["Inter"]
            },
            "fontSize": {
                    "body-md": ["16px", {"lineHeight": "1.5", "fontWeight": "400"}],
                    "h3": ["24px", {"lineHeight": "1.3", "fontWeight": "700"}],
                    "h1": ["48px", {"lineHeight": "1.1", "letterSpacing": "-0.02em", "fontWeight": "800"}],
                    "stats": ["20px", {"lineHeight": "1", "fontWeight": "700"}],
                    "label-caps": ["12px", {"lineHeight": "1", "letterSpacing": "0.1em", "fontWeight": "700"}],
                    "body-lg": ["18px", {"lineHeight": "1.6", "fontWeight": "400"}],
                    "h2": ["32px", {"lineHeight": "1.2", "letterSpacing": "-0.01em", "fontWeight": "700"}]
            }
          },
        },
      }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .offline-bg {
            background-color: #1A1A2E;
            background-image: radial-gradient(circle at 50% 50%, #16213E 0%, #1A1A2E 100%);
        }
        .spinning {
            animation: spin 2s linear infinite;
        }
        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="offline-bg text-on-surface font-body-md min-h-screen flex flex-center overflow-hidden">
<!-- Top Navigation Placeholder (Hidden for this state) -->
<!-- The TopAppBar and BottomNavBar are suppressed per Task instructions for a full-screen error state. -->
<main class="relative z-10 w-full max-w-[440px] mx-auto px-container-padding flex flex-col items-center justify-center min-h-screen">
<!-- Large Visual Anchor -->
<div class="relative mb-stack-lg">
<span class="material-symbols-outlined text-slate-500 !text-[80px]" data-icon="wifi_off">wifi_off</span>
<div class="absolute -top-1 -right-1 bg-[#E94560] rounded-full w-8 h-8 flex items-center justify-center border-4 border-[#1A1A2E] shadow-lg">
<span class="material-symbols-outlined text-white !text-lg font-bold" data-icon="close">close</span>
</div>
</div>
<!-- Typography Cluster -->
<div class="text-center mb-stack-lg">
<h1 class="font-h3 text-h3 text-white mb-unit">Connection Lost</h1>
<p class="font-body-md text-body-md text-[#A0A0B0] max-w-[280px] mx-auto">
                Your duel progress is saved. Reconnect to continue.
            </p>
</div>
<!-- Status Card -->
<div class="w-full bg-[#16213E] border border-[#4A4E8C]/30 rounded-xl p-[20px] mb-stack-lg shadow-2xl backdrop-blur-sm">
<div class="flex flex-col space-y-4">
<!-- Row 1: Saved -->
<div class="flex items-center space-x-3">
<span class="material-symbols-outlined text-[#22C55E]" data-icon="save" data-weight="fill" style="font-variation-settings: 'FILL' 1;">save</span>
<span class="font-body-md text-[#22C55E]">Duel progress auto-saved</span>
</div>
<!-- Row 2: Paused -->
<div class="flex items-center space-x-3">
<span class="material-symbols-outlined text-[#F59E0B]" data-icon="pause_circle" data-weight="fill" style="font-variation-settings: 'FILL' 1;">pause_circle</span>
<span class="font-body-md text-[#F59E0B]">Duel timer paused</span>
</div>
<!-- Row 3: Reconnecting -->
<div class="flex items-center justify-between">
<div class="flex items-center space-x-3">
<span class="material-symbols-outlined text-[#A0A0B0] spinning" data-icon="sync">sync</span>
<span class="font-body-md text-[#A0A0B0]">Attempting to reconnect…</span>
</div>
</div>
</div>
</div>
<!-- Actions -->
<div class="w-full space-y-stack-md flex flex-col items-center">
<button class="w-full bg-[#E94560] text-white font-bold py-4 rounded-xl shadow-[0_0_20px_rgba(233,69,96,0.3)] active:scale-95 transition-all flex items-center justify-center space-x-2">
<span class="material-symbols-outlined" data-icon="refresh">refresh</span>
<span>Try Reconnecting</span>
</button>
<a class="font-label-caps text-[#A0A0B0] hover:text-white transition-colors tracking-widest uppercase" href="#">
                Go to Home Screen
            </a>
</div>
<!-- Footer Note -->
<footer class="mt-stack-lg text-center">
<p class="italic text-[#A0A0B0] text-sm opacity-80">
                If this persists, check your internet connection.
            </p>
</footer>
</main>
<!-- Decorative Elements for Cinematic Aesthetic -->
<div class="fixed inset-0 pointer-events-none">
<div class="absolute top-0 left-0 w-full h-full bg-[radial-gradient(circle_at_50%_50%,_rgba(233,69,96,0.05)_0%,_transparent_50%)]"></div>
<div class="absolute bottom-0 left-0 w-full h-1/2 bg-gradient-to-t from-[#0F172A] to-transparent"></div>
</div>
</body></html>
