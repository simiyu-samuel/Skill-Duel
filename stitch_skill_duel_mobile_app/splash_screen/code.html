<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;800;900&amp;family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 48;
        }
    </style>
<script id="tailwind-config">

            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "tertiary-fixed-dim": "#67dc9f",

                        "on-tertiary": "#003921",
                        "on-primary": "#67001c",
                        "background": "#1d1011",
                        "surface-container-high": "#362627",
                        "secondary-fixed": "#e0e0ff",
                        "surface": "#1d1011",
                        "on-error-container": "#ffdad6",
                        "surface-container-low": "#261819",
                        "surface-dim": "#1d1011",
                        "surface-bright": "#463536",
                        "on-secondary-container": "#afb3f8",
                        "primary-fixed": "#ffdadb",
                        "error-container": "#93000a",
                        "error": "#ffb4ab",
                        "on-background": "#f7dcdd",
                        "inverse-surface": "#f7dcdd",
                        "on-secondary-fixed": "#0f1250",
                        "primary-container": "#fc536d",
                        "inverse-primary": "#b71d3f",
                        "outline-variant": "#5a4042",
                        "on-secondary-fixed-variant": "#3d417e",
                        "secondary-fixed-dim": "#bfc2ff",
                        "secondary-container": "#3f4380",
                        "inverse-on-surface": "#3d2c2d",
                        "surface-container-highest": "#413031",
                        "on-tertiary-fixed-variant": "#005232",
                        "surface-variant": "#413031",
                        "on-tertiary-container": "#00311c",
                        "primary": "#ffb2b7",
                        "secondary": "#bfc2ff",
                        "on-secondary": "#262a66",
                        "tertiary": "#67dc9f",
                        "on-error": "#690005",
                        "tertiary-fixed": "#84f9ba",
                        "primary-fixed-dim": "#ffb2b7",
                        "on-primary-container": "#5b0017",
                        "on-primary-fixed-variant": "#91002b",
                        "on-primary-fixed": "#40000e",
                        "on-surface": "#f7dcdd",
                        "outline": "#a9898a",
                        "on-tertiary-fixed": "#002111",
                        "surface-container": "#2b1c1d",
                        "on-surface-variant": "#e2bebf",
                        "surface-tint": "#ffb2b7",
                        "tertiary-container": "#25a46d"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "stack-sm": "8px",
                        "stack-lg": "32px",
                        "unit": "8px",
                        "container-padding": "24px",
                        "stack-md": "16px",
                        "gutter": "16px"
                    },
                    "fontFamily": {
                        "h3": ["Inter"],
                        "body-lg": ["Inter"],
                        "label-caps": ["Inter"],
                        "body-md": ["Inter"],
                        "stats": ["Inter"],
                        "h1": ["Inter"],
                        "h2": ["Inter"]
                    },
                    "fontSize": {
                        "h3": ["24px", {"lineHeight": "1.3", "fontWeight": "700"}],
                        "body-lg": ["18px", {"lineHeight": "1.6", "fontWeight": "400"}],
                        "label-caps": ["12px", {"lineHeight": "1", "letterSpacing": "0.1em", "fontWeight": "700"}],
                        "body-md": ["16px", {"lineHeight": "1.5", "fontWeight": "400"}],
                        "stats": ["20px", {"lineHeight": "1", "fontWeight": "700"}],
                        "h1": ["48px", {"lineHeight": "1.1", "letterSpacing": "-0.02em", "fontWeight": "800"}],

                },
            },
        }
    </script>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>

<body class="bg-surface-container-lowest min-h-screen flex flex-col items-center justify-center overflow-hidden selection:bg-primary-container selection:text-on-primary-container">
<!-- Splash Screen Container -->
<main class="relative flex flex-col items-center justify-center w-full h-full min-h-screen px-container-padding">
<!-- Ambient Background Depth -->
<div class="absolute inset-0 z-0 pointer-events-none overflow-hidden">
<div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[800px] h-[800px] bg-primary-container/5 rounded-full blur-[120px]"></div>
<div class="absolute top-1/4 left-1/3 w-[400px] h-[400px] bg-secondary-container/10 rounded-full blur-[100px]"></div>
<div class="absolute inset-0 bg-[url('https://www.transparenttextures.com/patterns/dark-matter.png')] opacity-20 pointer-events-none" data-alt="Subtle dark noise texture creating a cinematic film grain effect on a deep obsidian background"></div>
</div>
<!-- Central Branding Cluster -->
<div class="relative z-10 flex flex-col items-center text-center space-y-stack-lg">
<!-- Hero Icon -->
<div class="relative flex items-center justify-center">
<!-- Outer Glow -->
<div class="absolute inset-0 bg-primary-container/30 blur-2xl rounded-full scale-150"></div>
<div class="relative w-20 h-20 flex items-center justify-center text-primary-container">
<span class="material-symbols-outlined !text-[80px]" data-icon="swords" style="font-variation-settings: 'FILL' 1, 'wght' 400;">swords</span>
</div>
</div>
<!-- Brand Name & Tagline -->
<div class="flex flex-col items-center space-y-stack-sm">
<h1 class="font-h1 text-h1 text-on-background tracking-[0.2em] uppercase drop-shadow-[0_0_15px_rgba(252,83,109,0.4)]">
                    SKILL DUEL
                </h1>
<p class="font-body-md text-body-md text-on-surface-variant max-w-[280px] leading-relaxed">
                    Prove Your Knowledge. Dominate The Rank.
                </p>
</div>
</div>
<!-- Progress/Loading Section -->
<div class="absolute bottom-16 left-0 right-0 z-10 flex flex-col items-center space-y-stack-md">
<!-- Loading Bar -->
<div class="w-[120px] h-1.5 bg-surface-container-highest rounded-full overflow-hidden border border-outline-variant/10">
<div class="h-full bg-primary-container rounded-full w-2/3 shadow-[0_0_12px_rgba(252,83,109,0.8)]"></div>
</div>
<!-- Status Text -->
<span class="font-label-caps text-label-caps text-on-surface-variant/60 tracking-widest uppercase">
                Synchronizing Arena
            </span>
</div>
<!-- Decorative UI Elements -->
<div class="absolute top-8 left-8 border-l border-t border-primary-container/20 w-8 h-8 pointer-events-none"></div>
<div class="absolute top-8 right-8 border-r border-t border-primary-container/20 w-8 h-8 pointer-events-none"></div>
<div class="absolute bottom-8 left-8 border-l border-b border-primary-container/20 w-8 h-8 pointer-events-none"></div>
<div class="absolute bottom-8 right-8 border-r border-b border-primary-container/20 w-8 h-8 pointer-events-none"></div>
</main>
<!-- Hidden Component Anchors (Reference for Hierarchy/Styling) -->
<div class="hidden">
<!-- TopAppBar Context (Style Reference Only) -->
<div class="bg-slate-950/80 backdrop-blur-md text-rose-600 font-inter font-black tracking-tighter uppercase border-indigo-500/30"></div>
<!-- BottomNavBar Context (Style Reference Only) -->
<div class="bg-slate-950 text-rose-600 font-inter text-[10px] font-bold tracking-widest uppercase border-indigo-500/30 shadow-[0_-4px_20px_rgba(233,69,96,0.15)]"></div>
</div>
</body></html>
