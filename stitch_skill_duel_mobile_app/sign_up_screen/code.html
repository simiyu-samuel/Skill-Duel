<style>
        body {
            background-color: #1A1A2E;
            color: #f7dcdd;
            font-family: 'Inter', sans-serif;
        }
        .surface-card {
            background-color: #16213E;
        }
        .accent-color {
            color: #E94560;
        }

            background-color: #E94560;

            background-color: #16213E;
            height: 52px;
            border-radius: 12px;
            border: 1px solid rgba(74, 78, 140, 0.3);
        }
        .input-base:focus-within {
            border-color: #bfc2ff;
            box-shadow: 0 0 0 1px #bfc2ff;
        }
        .strength-segment {
            height: 4px;
            flex: 1;
            border-radius: 2px;
            background-color: #2b1c1d;
        }
        .strength-filled {
            background-color: #f59e0b; /* Amber for medium strength */
        }

    body {
      min-height: max(884px, 100dvh);

<body class="min-h-screen flex flex-col items-center">
<!-- TopAppBar -->
<header class="bg-slate-950 text-slate-400 border-b border-[#4A4E8C]/30 flex items-center justify-between px-6 py-4 w-full sticky top-0 z-50">
<div class="flex items-center gap-4">
<button class="hover:text-[#E94560] hover:scale-110 transition-transform active:scale-95 duration-150 ease-in-out">
<span class="material-symbols-outlined">arrow_back</span>
</button>
<span class="text-xl font-black italic text-white uppercase tracking-wider">Skill Duel</span>
</div>
<div></div> <!-- Spacer for centering feel -->
</header>
<!-- Main Content Canvas -->
<main class="w-full max-w-[480px] px-container-padding flex flex-col pb-stack-lg">
<!-- Header Section -->
<div class="pt-6">
<h1 class="text-[26px] font-bold text-white leading-tight">Create Account</h1>
<p class="text-[15px] text-[#A0A0B0] mt-1">Pick a username. Build your legacy.</p>
</div>
<!-- Form Section -->
<form class="mt-stack-lg space-y-4">
<!-- Full Name -->
<div class="flex flex-col gap-2">
<label class="font-label-caps text-label-caps text-on-surface-variant uppercase">Full Name</label>
<div class="input-base flex items-center px-4">
<input class="bg-transparent border-none focus:ring-0 w-full text-white placeholder-slate-500" placeholder="John Doe" type="text"/>
</div>
</div>
<!-- Username -->
<div class="flex flex-col gap-2">
<label class="font-label-caps text-label-caps text-on-surface-variant uppercase">Username</label>
<div class="input-base flex items-center px-4 gap-2">
<span class="text-slate-500 font-bold">@</span>
<input class="bg-transparent border-none focus:ring-0 w-full text-white placeholder-slate-500" placeholder="pro_gamer" type="text"/>
<span class="text-xs text-slate-500 whitespace-nowrap">0/15</span>
</div>
</div>
<!-- Email -->
<div class="flex flex-col gap-2">
<label class="font-label-caps text-label-caps text-on-surface-variant uppercase">Email Address</label>
<div class="input-base flex items-center px-4">
<input class="bg-transparent border-none focus:ring-0 w-full text-white placeholder-slate-500" placeholder="challenger@skillduel.com" type="email"/>
</div>
</div>
<!-- Password -->
<div class="flex flex-col gap-2">
<label class="font-label-caps text-label-caps text-on-surface-variant uppercase">Password</label>
<div class="input-base flex items-center px-4">
<input class="bg-transparent border-none focus:ring-0 w-full text-white placeholder-slate-500" placeholder="••••••••" type="password"/>
<span class="material-symbols-outlined text-slate-500 cursor-pointer">visibility_off</span>
</div>
<!-- Strength Indicator -->
<div class="flex gap-1 mt-1">
<div class="strength-segment strength-filled"></div>
<div class="strength-segment strength-filled"></div>
<div class="strength-segment"></div>
<div class="strength-segment"></div>
</div>
<span class="text-[10px] text-[#A0A0B0] uppercase font-bold tracking-wider">Medium Strength</span>
</div>
<!-- Confirm Password -->
<div class="flex flex-col gap-2">
<label class="font-label-caps text-label-caps text-on-surface-variant uppercase">Confirm Password</label>
<div class="input-base flex items-center px-4">
<input class="bg-transparent border-none focus:ring-0 w-full text-white placeholder-slate-500" placeholder="••••••••" type="password"/>
</div>
</div>
<div class="py-2"></div>
<!-- Terms Checkbox -->
<div class="flex items-start gap-3">
<input class="mt-1 w-4 h-4 rounded border-slate-700 bg-slate-900 text-[#E94560] focus:ring-[#E94560] focus:ring-offset-slate-900" id="terms" type="checkbox"/>
<label class="text-sm text-on-surface-variant leading-snug" for="terms">
                    I agree to the <a class="underline accent-color" href="#">Terms of Service</a> and <a class="underline accent-color" href="#">Privacy Policy</a>
</label>
</div>
<!-- CTA Button -->
<div class="pt-4">
<button class="w-full h-[56px] bg-accent text-white font-bold rounded-[12px] text-lg shadow-lg shadow-[#E94560]/20 hover:scale-[1.02] transition-transform active:scale-95" type="submit">
                    Create Account
                </button>
</div>
</form>
<!-- Footer -->
<footer class="mt-stack-lg text-center pb-8">
<p class="text-sm text-on-surface-variant">
                Already have an account? 
                <a class="accent-color font-bold ml-1 hover:underline" href="#">Log In</a>
</p>
</footer>
<!-- Decorative Background Element -->
<div class="fixed bottom-0 left-0 w-full h-1/3 bg-gradient-to-t from-[#E94560]/5 to-transparent pointer-events-none -z-10"></div>
</main>
